name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The browser test project runs in headless Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      # Playwright against the local Worker, which the config starts.
      - run: pnpm e2e
      - run: pnpm format:check
      - run: pnpm build
